title: "Mathematical Computing with Python"
author: "YSharareh Sayyad"
logo: ""
copyright: "2026"

# Force re-execution of notebooks on every build so outputs are always fresh.
execute:
  execute_notebooks: force
  timeout: 120

# Add a bit of extra content-processing power (math, etc.)
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist

# HTML-specific settings
html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: true
  favicon: ""
  extra_navbar: "Built with Jupyter Book for Mathematical Computing with Python."

# Repository / launch settings
repository:
  url: https://github.com/say-yas/mathematical_computing_with_python
  path_to_book: book
  branch: main

launch_buttons:
  notebook_interface: "jupyterlab"
  colab_url: "https://colab.research.google.com"

# To add citations later: create book/references.bib, then uncomment below.
# bibtex_bibfiles:
#   - references.bib
